<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oasis Forever | Quiz</title>
  <link rel="stylesheet" href="./css/style2.css">
</head>

<body>

 <div class="dashboard-wrapper tela-quiz">
    <header class="header-banner">
      <div class="nav-bar">
        <div class="logo">
          <img src="./assets/img/oasis_logo.png" alt="Logo Oasis" class="logo-img">
          <span class="forever-text">FOREVER</span>
        </div>

        <nav>
          <a href="./dashboard.html">Dashboard</a> 
          <a href="./quiz.html" class="active">Questionário</a>
        </nav>

        <a href="./index.html">
          <button class="btn-sair">SAIR</button>
        </a>
      </div>

      <div class="welcome-text">
        Olá, <span id="b_usuario">*Nome do usuário*</span>!
      </div>
    </header>

    <main class="main-content">
      <div class="card-quiz" id="card_quiz">
        
        <div id="tela_inicial">
          <h2>Quem você seria?</h2>
          <p>Noel x Liam</p>
          
          <div class="quiz-interactive">
            <img src="./assets/img/noel.png" alt="Noel Gallagher" class="img-noel">
            
            <button class="btn-comecar" onclick="iniciarQuiz()">Começar Teste</button>
            
            <img src="./assets/img/liam.png" alt="Liam Gallagher" class="img-liam">
          </div>
        </div>

        <div id="tela_perguntas" style="display: none;">
          <h2>Quem você seria?</h2>
          <p>Noel x Liam</p>

          <div class="quiz-container">
            <div class="pergunta-titulo">
              <span id="span_numero_pergunta">1.</span>
              <span id="span_texto_pergunta">Se você tivesse na situação tal você ficaria irritado com tal coisa?</span>
            </div>

            <ul class="lista-respostas" id="ul_respostas">
              <li onclick="selecionar(this)">Sim</li>
              <li onclick="selecionar(this)">Com certeza</li>
              <li onclick="selecionar(this)">Talvez</li>
              <li onclick="selecionar(this)">Não</li>
            </ul>

            <div class="navegacao-quiz">
              <button class="btn-nav" id="btn_voltar" onclick="voltarPergunta()">
                <img src="https://img.icons8.com/ios-glyphs/30/ffffff/long-arrow-left.png" alt="Voltar">
              </button>
              <button class="btn-nav" id="btn_proximo" onclick="proximaPergunta()">
                <img src="https://img.icons8.com/ios-glyphs/30/ffffff/long-arrow-right.png" alt="Próximo">
              </button>
            </div>
        </div>
        </div>

        <div id="tela_resultado" style="display: none;">
          <h2>Seu Resultado</h2>
          <div class="resultado-container">
            <img id="img_resultado" src="" alt="Foto do Integrante">
            <h3 id="nome_resultado"></h3>
            <p id="desc_resultado"></p>
            <button class="btn-comecar" onclick="window.location.reload()">Refazer Teste</button>
          </div>
        </div>
      </div>
    </main>
  </div>

    <script>

    b_usuario.innerHTML = sessionStorage.NOME_USUARIO ;


      let listaPerguntas = [];
      let perguntaAtual = 0;
      let respostasEscolhidas = []; 
      let indicesEscolhidos = [];

function iniciarQuiz() {
    tela_inicial.style.display = 'none';
    tela_perguntas.style.display = 'block';

    fetch("/quiz/listar", {
        method: "GET",
    })
    .then(function (resposta) {
        resposta.json().then((perguntas) => {
            listaPerguntas = perguntas;
            mostrarPergunta();
        });
    })
    .catch(function (erro) {
        console.log("Erro ao buscar perguntas: ", erro);
    });
}

function mostrarPergunta() {
    const pergunta = listaPerguntas[perguntaAtual];
    
    span_numero_pergunta.innerText = `${perguntaAtual + 1}.`;
    span_texto_pergunta.innerText = pergunta.texto;
    
    ul_respostas.innerHTML = ""; 

    pergunta.opcoes.forEach((opcao, index) => {
        const li = document.createElement("li");
        li.innerText = opcao.texto;
        li.dataset.perfil = opcao.perfil; 

        li.onclick = () => selecionar(li, index);

        if(respostasEscolhidas[perguntaAtual] === index) {
            li.classList.add('selecionada');
        }

        ul_respostas.appendChild(li);
    });

    btn_voltar.disabled = (perguntaAtual === 0);
}

function selecionar(elemento, index) {
    const itens = document.querySelectorAll('#ul_respostas li');
    
    for (let i = 0; i < itens.length; i++) {
        itens[i].classList.remove('selecionada');
    }
    
    elemento.classList.add('selecionada');
    respostasEscolhidas[perguntaAtual] = elemento.dataset.perfil;

    indicesEscolhidos[perguntaAtual] = index;
}

function proximaPergunta() {
    if (!respostasEscolhidas[perguntaAtual]) {
        alert("Escolha uma opção antes de avançar!");
        return;
    }

    if (perguntaAtual < listaPerguntas.length - 1) {
        perguntaAtual++;
        mostrarPergunta();
    } else {
        finalizarQuiz();
    }
}

function voltarPergunta() {
    if (perguntaAtual > 0) {
        perguntaAtual--;
        mostrarPergunta();
    }
}

function finalizarQuiz() {
        console.log("ID do Usuário no sessionStorage:", sessionStorage.ID_USUARIO);
        let pontosLiam = 0;
        let pontosNoel = 0;

        for (let i = 0; i < respostasEscolhidas.length; i++) {
            if (respostasEscolhidas[i] === 'Liam') {
                pontosLiam++;
            } else if (respostasEscolhidas[i] === 'Noel') {
                pontosNoel++;
            }
        }

        let resultadoFinal = "Neutro";
        if (pontosLiam > pontosNoel) {
            resultadoFinal = "Liam";
        } else if (pontosNoel > pontosLiam) {
            resultadoFinal = "Noel";
        } else if (pontosLiam === pontosNoel && pontosLiam > 0) {
            resultadoFinal = "Liam"; 
        }

        var idUsuario = sessionStorage.ID_USUARIO; 

        fetch("/quiz/salvar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idUsuarioServer: idUsuario,
                resultadoFinalServer: resultadoFinal
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                tela_perguntas.style.display = 'none';
                
                tela_resultado.style.display = 'block';
                
                if (resultadoFinal === "Liam") {
                    img_resultado.src = "./assets/img/liam2.jpg"; 
                    nome_resultado.innerText = "Liam Gallagher";
                    desc_resultado.innerText = "Você é o frontman absoluto! Possui uma presença inigualável, muita atitude e age de forma totalmente impulsiva e autêntica. Não se importa com as opiniões alheias e vive intensamente.";
                } else {
                    img_resultado.src = "./assets/img/noel2.jpg"; 
                    nome_resultado.innerText = "Noel Gallagher";
                    desc_resultado.innerText = "Você é o cérebro por trás da música! Prefere o planejamento, valoriza o controle da situação, tem um sarcasmo afiado e é focado no profissionalismo. Expressa sua genialidade através da lógica e da técnica.";
                }
            }
        }).catch(function (erro) {
            console.log("Erro ao salvar resultado: ", erro);
        });
    }
    </script>
</body>
