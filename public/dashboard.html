<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oasis Forever | Dashboard</title>
  <link rel="stylesheet" href="./css/style2.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body onload="buscarTotalRespostas(); buscarPredominante(); buscarDadosQuestionario(); buscarRespostasPorDia(); buscarRespostasPeriodo(); buscarRespostasPorIdade()">

  <div class="dashboard-wrapper">
    <header class="header-banner">
      <div class="nav-bar">
        <div class="logo">
          <img src="./assets/img/oasis_logo.png" alt="Logo Oasis" class="logo-img">
          <span class="forever-text">FOREVER</span>
        </div>
        <nav>
          <a href="./dashboard.html" class="active">Dashboard</a>
          <a href="./quiz.html">Questionário</a>
        </nav>
        <a href="./index.html">
          <button class="btn-sair">SAIR</button>
        </a>
      </div>

      <div class="welcome-text">
        Olá, <span id="b_usuario">*Nome do usuário*</span>!
      </div>

      <div class="top-cards-container">
        <div class="card-blue">
          <span class="label">RESPOSTAS</span>
          <div class="value" id="total_respostas">--</div>
        </div>
        <div class="card-blue">
          <span class="label">PREDOMINANTE</span>
          <div class="value-text" id="resultado_predominante">--</div>
        </div>
        <div class="gender-stats">
          <div class="gender-row">
            <span>Mulheres</span>
            <span class="perc">--%</span>
          </div>
          <div class="gender-row">
            <span>Homens</span>
            <span class="perc">--%</span>
          </div>
        </div>
      </div>
    </header>

    <main class="graficos">
      <div class="grafico-card wide">
        <h3>Resultados por dia da semana</h3>

        <div class="placeholder-area">
          <canvas id="graficolinha"></canvas>
        </div>
      </div>
      <div class="grafico-card tall">
        <h3>Respostas Período do Dia</h3>
        <div class="placeholder-area">
          <canvas id="graficobarra"></canvas>

        </div>
      </div>
      <div class="grafico-card card-pizza">
        <h3>Resultados Questionário</h3>
        <div class="placeholder-area">
          <canvas id="graficopizza"></canvas>
        </div>

      </div>
      <div class="grafico-card card-pizza">
        <h3>Resultados por Idade</h3>
        <div class="placeholder-area">

          <canvas id="graficopizza2"></canvas>
        </div>


      </div>
    </main>
  </div>

  <script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    function buscarTotalRespostas() {
      fetch("/dashboard/contarRespostas", {
        method: "GET",
      })
        .then(function (resposta) {
          resposta.json().then((json) => {
            console.log("Dados recebidos: ", json);

            // Pega o elemento pelo ID e joga o número lá dentro
            document.getElementById("total_respostas").innerHTML = json.totalRespostas;
          });
        })
        .catch(function (erro) {
          console.log("Erro ao buscar total de respostas: ", erro);
        });
    }

    function buscarPredominante() {
      fetch("/dashboard/resultadoPredominante", {
        method: "GET",
      })
        .then(function (resposta) {
          resposta.json().then((json) => {
            console.log("Predominante recebido: ", json);

            // Pega o elemento pelo ID e joga o nome (perfil_final) lá dentro
            document.getElementById("resultado_predominante").innerHTML = json.perfil_final;
          });
        })
        .catch(function (erro) {
          console.log("Erro ao buscar o predominante: ", erro);
        });
    }

    function buscarDadosQuestionario() {
      fetch("/dashboard/dadosQuestionario", {
        method: "GET",
      })
        .then(function (resposta) {
          resposta.json().then((json) => {
            console.log("Dados recebidos para o gráfico: ", json);

            let pontosLiam = 0;
            let pontosNoel = 0;

            for (let i = 0; i < json.length; i++) {
              if (json[i].perfil_final === 'Liam') {
                pontosLiam = json[i].quantidade;
              } else if (json[i].perfil_final === 'Noel') {
                pontosNoel = json[i].quantidade;
              }
            }

            // Injeta os dados novos dentro do gráfico
            graficopizza1.data.datasets[0].data = [pontosLiam, pontosNoel];
            graficopizza1.update();
          });
        })
        .catch(function (erro) {
          console.log("Erro ao buscar dados do gráfico: ", erro);
        });
    }

    function buscarRespostasPorDia() {
        fetch("/dashboard/respostasPorDia", {
            method: "GET",
        })
        .then(function (resposta) {
            resposta.json().then((json) => {
                console.log("Dados recebidos para dias da semana: ", json);
                
                // Array com 7 posições (de 0 a 6, representando de Segunda a Domingo)
                let liamDias = [0, 0, 0, 0, 0, 0, 0];
                let noelDias = [0, 0, 0, 0, 0, 0, 0];

                for (let i = 0; i < json.length; i++) {
                    let registro = json[i];
                    
                    // O banco de dados retorna 0 para Segunda, 1 para Terça...
                    // Isso é perfeito porque é exatamente a posição do nosso array!
                    let dia = registro.dia_semana;

                    if (registro.perfil_final === 'Liam') {
                        liamDias[dia] = registro.quantidade;
                    } else if (registro.perfil_final === 'Noel') {
                        noelDias[dia] = registro.quantidade;
                    }
                }

                // Injeta os dados no gráfico de linhas
                graficolinha1.data.datasets[0].data = liamDias; // Liam é o dataset 0
                graficolinha1.data.datasets[1].data = noelDias; // Noel é o dataset 1
                
                graficolinha1.update();
            });
        })
        .catch(function (erro) {
            console.log("Erro ao buscar dados de dias da semana: ", erro);
        });
    }

    function buscarRespostasPeriodo() {
        fetch("/dashboard/respostasPeriodo", {
            method: "GET",
        })
        .then(function (resposta) {
            resposta.json().then((json) => {
                console.log("Dados recebidos para período do dia: ", json);
                
                let liamPeriodo = [0, 0, 0];
                let noelPeriodo = [0, 0, 0];

                for (let i = 0; i < json.length; i++) {
                    let registro = json[i];
                    let posicaoArray = 0;

                    if (registro.periodo === 'Manha') {
                        posicaoArray = 0;
                    } else if (registro.periodo === 'Tarde') {
                        posicaoArray = 1;
                    } else if (registro.periodo === 'Noite') {
                        posicaoArray = 2;
                    }

                    if (registro.perfil_final === 'Liam') {
                        liamPeriodo[posicaoArray] = registro.quantidade;
                    } else if (registro.perfil_final === 'Noel') {
                        noelPeriodo[posicaoArray] = registro.quantidade;
                    }
                }

                // Injeta os arrays preenchidos dentro do gráfico correto (graficobarra1)
                graficobarra1.data.datasets[0].data = liamPeriodo; 
                graficobarra1.data.datasets[1].data = noelPeriodo; 
                
                graficobarra1.update();
            });
        })
        .catch(function (erro) {
            console.log("Erro ao buscar dados de período: ", erro);
        });
    }

    function buscarRespostasPorIdade() {
        fetch("/dashboard/respostasPorIdade", {
            method: "GET",
        })
        .then(function (resposta) {
            resposta.json().then((json) => {
                console.log("Dados recebidos para idades: ", json);
                
                // A ordem oficial das labels do seu gráfico4 é:
                // ['41 - 55', '55 +', '26 - 40', '19 - 25', '13 - 18']
                let idadesQuantidades = [0, 0, 0, 0, 0];

                for (let i = 0; i < json.length; i++) {
                    let registro = json[i];

                    if (registro.faixa_etaria === '41 - 55') {
                        idadesQuantidades[0] = registro.quantidade;
                    } else if (registro.faixa_etaria === '55 +') {
                        idadesQuantidades[1] = registro.quantidade;
                    } else if (registro.faixa_etaria === '26 - 40') {
                        idadesQuantidades[2] = registro.quantidade;
                    } else if (registro.faixa_etaria === '19 - 25') {
                        idadesQuantidades[3] = registro.quantidade;
                    } else if (registro.faixa_etaria === '13 - 18') {
                        idadesQuantidades[4] = registro.quantidade;
                    }
                }

                // Atualiza o gráfico de idades com os valores reais
                graficopizza2.data.datasets[0].data = idadesQuantidades;
                graficopizza2.update();
            });
        })
        .catch(function (erro) {
            console.log("Erro ao buscar dados de idades: ", erro);
        });
    }
    


    const labelsDias = ['segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado', 'domingo'];
    const labelsMeses = ['Manhã', 'Tarde', 'Noite'];

    const opcoesPizza = {
      responsive: true,
      maintainAspectRatio: false
    };

    const opcoesLinhaBarra = {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          grid: {
            display: false // Remove as linhas verticais
          }
        },
        y: {
          grid: {
            display: false // Remove as linhas horizontais
          }
        }
      }
    };

    const grafico1 = {
      labels: labelsDias,
      datasets: [
        {
          label: 'Liam',
          data: [30, 29, 28, 25, 22, 23],
          borderColor: 'rgb(124, 43, 153)',
          tension: 0.1
        },
        {
          label: 'Noel',
          data: [80, 82, 80, 85, 80, 83],
          borderColor: 'rgb(123, 167, 227)',
          tension: 0.1
        }
      ]
    };

    const grafico2 = {
      labels: labelsMeses,
      datasets: [
        {
          label: 'Liam',
          data: [22, 24, 27, 23, 20, 28],
          backgroundColor: 'rgba(124, 43, 153, 0.5)',
          borderWidth: 1
        },

        {
          label: 'Noel',
          data: [90, 89, 93, 87, 88, 82],
          backgroundColor: 'rgba(123, 167, 227, 0.5)',
          borderWidth: 1
        }

      ]

    };


    const grafico3 = {
      labels: [
        'Liam',
        'Noel'
      ],
      datasets: [{
        label: 'Quantidade',
        data: [70, 30],
        backgroundColor: [
          'rgb(255, 99, 132)',
          'rgb(54, 162, 235)',
          'rgb(255, 205, 86)'
        ],
        hoverOffset: 4
      }]
    };

    const grafico4 = {
      labels: [
        '41 - 55',
        '55 +',
        '26 - 40',
        '19 - 25',
        '13 - 18'
      ],
      datasets: [{
        label: 'Quantidade',
        data: [300, 50, 100, 25, 170],
        backgroundColor: [
         'rgb(255, 99, 132)',
          'rgb(54, 162, 235)',
          'rgb(255, 205, 86)',
          'rgb(75, 192, 192)',   // Adicionei umas cores extras
          'rgb(153, 102, 255)'   // para a pizza ficar co
        ],
        hoverOffset: 4
      }]
    };

    const configLinha = {
      type: 'line',
      data: grafico1,
      options: opcoesLinhaBarra

    };

    const configBarra = {
      type: 'bar',
      data: grafico2,
      options: opcoesLinhaBarra
    };

    const configPizza = {
      type: 'doughnut',
      data: grafico3,
      options: opcoesPizza

    };

    const configPizza2 = {
      type: 'doughnut',
      data: grafico4,
      options: opcoesPizza

    };

    let graficolinha1 = new Chart(document.getElementById('graficolinha'), configLinha);    
    // Gráfico de barras salvo na variável correta para o fetch atualizar
    let graficobarra1 = new Chart(document.getElementById('graficobarra'), configBarra);
    
    // Gráfico de pizza salvo na variável correta para o fetch atualizar
    let graficopizza1 = new Chart(document.getElementById('graficopizza'), configPizza);

let graficopizza2 = new Chart(document.getElementById('graficopizza2'), configPizza2);    
    // Gráfico de idades trazido de volta para a tela
  </script>
</body>

</html>
